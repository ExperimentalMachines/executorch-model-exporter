[project]
name = "exe-expo"
version = "0.1.0"
description = "Watches Hugging Face for small dense LLMs and exports them to ExecuTorch for the openweights app"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Research evidence is kept exactly as it was run.
extend-exclude = ["docs/research/evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
