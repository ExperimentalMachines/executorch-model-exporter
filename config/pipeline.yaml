# Settings for the watcher and the export workflows. Toolchain versions live in
# requirements/*.txt; config/versions.env holds the ones pip does not install.

hub:
  # Where exports are published. One repo per source model: <org>/<source name><suffix>.
  org: experimentalmachines
  repo_suffix: -ExecuTorch
  # Tags on every published repo. The app's Discover screen searches filter=executorch.
  tags: [executorch, android, on-device, openweights]

watch:
  # Watched orgs, each for its own families only (the app template token in the repo name),
  # so one lab's fine-tune of another lab's model is not picked up. Backfill and manual
  # exports ignore this.
  org_families:
    Qwen: [qwen3, qwen25]
    google: [gemma3]
    meta-llama: [llama32]
    HuggingFaceTB: [smollm2, smollm3]
  # Newest repos listed per org and watcher run (the listing is sorted by creation date).
  # Qwen alone has 465 repos and its 200 newest (2026-09-13) start after Qwen3-4B, so the
  # window has to cover a whole org; google's 1,134 is the largest.
  limit_per_org: 1500
  # Export workflow runs one watcher run may start; the rest wait for the next run. Each
  # run fans out into one job per window (and chip); GitHub runs 20 jobs at a time and
  # queues the rest, so this bounds the queue, not the runner load.
  max_dispatch_per_run: 40
  pipeline_tag: text-generation
  # Size limit, read from the size in the repo name ("4B", "360M"): at most this many
  # billions. Publishers name by nominal size; Qwen3-4B's real total is 4,022,468,096, so
  # a strict cap on the real count would drop the whole 4B class.
  max_nominal_billions: 4.0
  # Hard cap on the real parameter count (HF safetensors metadata), whatever the name says.
  max_params: 4500000000
  # A repo whose name contains one of these (case-insensitive, separators removed) is
  # skipped: pre-quantized weights cannot be re-exported, and the others are not chat or
  # completion models even when their architecture is a causal LM.
  name_exclude:
    - awq
    - gptq
    - gguf
    - fp8
    - fp4
    - int4
    - int8
    - mlx
    - bnb
    - onnx
    - exl2
    - 4bit
    - 8bit
    - w4a16
    - w8a8
    - embedding
    - reranker
    - reward

export:
  # Every window is exported, one workflow job each, for every model and backend; the app
  # and the benchmarker decide what fits a phone. A window the runner cannot export (memory
  # grows with the square of the window, docs/PLAN.md) is skipped and reported.
  context_tiers: [32768, 16384, 8192, 4096, 2048]
  # Phone budget for resident memory (.pte + KV cache + runtime overhead). Samsung's and
  # MIUI's memory guards killed the app at 6 GB PSS in the openweights window matrix
  # (docs/research/executorch-window-matrix.md). Not a gate: recorded per file as
  # fits_phone_budget in config.json and the export report.
  device_budget_bytes: 5000000000
  runtime_overhead_bytes: 500000000
  # Prefill chunk (get_max_seq_len). The app's measured recipe uses 2048.
  prefill_chunk: 2048
  xnnpack:
    qmode: 8da4w
    group_size: 32
    embedding_quantize: "8,0"
    # torchao's HQQ scale search for the embedding is platform-dependent, so the same model
    # built on two hosted runners differs in the embedding's low bits and small models decode
    # different text. Affine is deterministic; leave this false to keep builds reproducible.
    embedding_hqq: false
  vulkan:
    # The GPU delegate runs the same torchao 8da4w linears (backends/vulkan/vulkan-quantization);
    # the file is otherwise the XNNPACK recipe with backend.vulkan in export_llm.
    qmode: 8da4w
    group_size: 32
    embedding_quantize: "8,0"
    embedding_hqq: false
  qnn:
    # HTP context binaries are compiled per chip and load only on that chip. The benchmark
    # devices (docs/PLAN.md, "Devices"): Snapdragon 8 Elite (Galaxy S25 Ultra) = SM8750.
    # Add SM8650 for 8 Gen 3 devices; each chip is its own compile and its own folder.
    socs: [SM8750]
    # Hybrid mode: a prefill graph consuming prefill_ar_len tokens per step plus a
    # one-token decode graph, both compiled into the .pte.
    model_mode: hybrid
    prefill_ar_len: 128
    # NPU graphs have static shapes; the window is fixed at compile time. 2048 is a
    # conservative first setting (Qualcomm's examples use 1024-2048).
    max_context_len: 2048
    # Qualcomm's documented PTQ calibration for these scripts.
    calib_tasks: [wikitext]
    calib_limit: 1
  mtk:
    # NeuroPilot binaries are compiled per platform. MT6991 (Dimensity 9400, DX4).
    socs: [MT6991]
    # MediaTek's LLM recipe (examples/mediatek/shell_scripts/export_*.sh): 16-bit
    # activations, 4-bit weights, the model cut into chunks of equal layer counts.
    precision: A16W4
    max_chunks: 4
    # Static shapes: a prompt graph taking prompt_tokens per step and a one-token
    # generation graph, both over a cache of cache_size tokens (the window).
    #
    # 512 is MediaTek's default and was the only window that would build: calibration held
    # every prompt's steps at once, each with a full fp32 KV cache at the window, and 2048
    # exhausted a 16.8 GB runner and took it down. The patched scripts pass
    # writer_batch_size=1 so one prompt is resident instead of all nine, which takes the
    # corpus size out of the peak and puts 2k to 32k within a blacksmith-32vcpu runner.
    # This stays at MediaTek's default because it is the floor of the matrix; the windows
    # actually built come from context_tiers through the workflow's contexts input.
    prompt_tokens: 128
    cache_size: 512
    # Calibration prompts shipped with examples/mediatek, and the generated tokens per
    # prompt that calibrate the one-token graph (MediaTek's default 9). qwen.py calibrates on
    # these alone, in the family's preformatter template. lfm2.py calibrates on the
    # long-context corpus instead (pipeline/mtk_corpus.py): these nine as its short samples,
    # rendered in the model's own chat template, plus long_samples conversations and passages
    # that fill the window, because the activation observers are MinMax and a nine-prompt set
    # of sixty tokens never shows them the positions a long context reaches.
    calibration: aot_utils/llm_utils/prompts/alpaca.txt
    response_cap: 9
    long_samples: 14
    # Kept for the report and for older recipes: since writer_batch_size=1 the peak is one
    # prompt's steps whatever the corpus size, so no window trims the corpus any more and a
    # window that does not fit is skipped outright rather than calibrated on too little.
    # Each export report still records prompts_used, so a reader can see what was used.
    min_calibration_prompts: 4
    # x86 Blacksmith runners, smallest first; export_mtk.pick_runner takes the first that
    # carries a window. x86 because mtk_converter is a cp310 x86 wheel and mtk_neuron is
    # tagged linux_x86_64, so no ARM tier can run the toolchain at all, whatever its size.
    #
    # For qwen.py both numbers bind. Memory is one prompt's calibration steps; disk is every
    # prompt's, because writer_batch_size=1 moved them to the Arrow cache. The 1.2B at 16k is
    # the case that shows why disk is listed: it has the RAM for an 8vcpu runner and not the
    # disk. swap_gib is what the workflow asks prepare-host.sh for on that tier, sized to
    # leave the cache room on the same filesystem.
    #
    # lfm2.py calibrates in one streaming pass that keeps no step, so neither grows with the
    # window much and time is what binds: max_window is the largest window a tier is given,
    # so a 32k calibration, which runs a quarter of a million tokens through the model twice,
    # lands on the cores that finish it inside the job limit.
    runner_tiers:
      - label: blacksmith-8vcpu-ubuntu-2404
        ram_bytes: 32000000000
        disk_bytes: 160000000000
        swap_gib: 24
        max_window: 4096
      - label: blacksmith-16vcpu-ubuntu-2404
        ram_bytes: 64000000000
        disk_bytes: 750000000000
        swap_gib: 64
        max_window: 16384
      - label: blacksmith-32vcpu-ubuntu-2404
        ram_bytes: 128000000000
        disk_bytes: 1500000000000
        swap_gib: 96
