name: Export QNN
run-name: "QNN: ${{ inputs.model_id }}@${{ inputs.revision }}${{ inputs.contexts && format(' ctx {0}', inputs.contexts) || '' }}"

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id listed in ExecuTorch 1.4.0's Qualcomm LLM scripts, e.g. Qwen/Qwen3-1.7B
        required: true
        type: string
      revision:
        description: Branch, tag or commit of the source repo; the Qualcomm script compiles main, so the run refuses anything else
        default: main
        type: string
      socs:
        description: JSON list of chips, or empty for qnn.socs in config/pipeline.yaml
        default: ""
        type: string
      contexts:
        description: JSON list of context windows in tokens, one job per chip and window; empty for every tier in config/pipeline.yaml
        default: ""
        type: string
      publish_hf:
        description: Publish to the Hugging Face org in config/pipeline.yaml
        default: true
        type: boolean
      publish_release:
        description: Attach the files to a GitHub release
        default: true
        type: boolean

permissions:
  contents: write # GitHub releases

concurrency:
  group: export-qnn-${{ inputs.model_id }}
  cancel-in-progress: false

jobs:
  targets:
    # Hub metadata only, no model download.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    outputs:
      socs: ${{ steps.socs.outputs.socs }}
      contexts: ${{ steps.contexts.outputs.contexts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: socs
        env:
          SOCS: ${{ inputs.socs }}
        run: |
          if [ -z "$SOCS" ]; then
            python3 -m pip install --quiet pyyaml
            SOCS=$(python3 -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("config/pipeline.yaml"))["export"]["qnn"]["socs"]))')
          fi
          echo "socs=$SOCS" >>"$GITHUB_OUTPUT"
      - id: contexts
        env:
          CONTEXTS: ${{ inputs.contexts }}
        # Accepts a JSON list, one number, or a comma-separated list; empty means every tier.
        run: |
          python3 -m pip install --quiet pyyaml
          CONTEXTS=$(python3 - "$CONTEXTS" <<'PY'
          import json, sys, yaml
          raw = sys.argv[1].strip()
          if not raw:
              values = yaml.safe_load(open("config/pipeline.yaml"))["export"]["context_tiers"]
          else:
              try:
                  values = json.loads(raw)
              except ValueError:
                  values = [v for v in raw.strip("[]").split(",") if v.strip()]
              if not isinstance(values, list):
                  values = [values]
          print(json.dumps(sorted({int(v) for v in values}, reverse=True)))
          PY
          )
          echo "contexts=$CONTEXTS" >>"$GITHUB_OUTPUT"

  export:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(needs.targets.outputs.socs) }}
        context: ${{ fromJSON(needs.targets.outputs.contexts) }}
    # Stays on x86: the Qualcomm backend ships only in the executorch Linux x86_64
    # wheel, and the QAIRT SDK it downloads is x86_64 (this workflow checks for
    # libQnnHtp.so under an x86_64 path).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      SOC: ${{ matrix.soc }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-export
        with:
          swap-gib: "24"
          requirements: requirements/export-qnn.txt

      - name: Name things
        run: |
          grep -E '^QAIRT_VERSION=' config/versions.env >>"$GITHUB_ENV"
          soc_lower=$(echo "$SOC" | tr '[:upper:]' '[:lower:]')
          echo "TARGET=$soc_lower" >>"$GITHUB_ENV"
          echo "ARTIFACT=qnn-${soc_lower}-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"

      # The executorch wheel downloads the QAIRT SDK and a libc++ into ~/.cache/executorch/qnn
      # on first import. Cached per version in this repository only; never re-hosted. Restore
      # and save are separate steps so the cache is kept even when the export fails.
      - name: Restore QAIRT
        id: qairt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/executorch/qnn
          key: qairt-${{ env.QAIRT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install QAIRT
        run: |
          python -c "import executorch.backends.qualcomm" 2>&1 | grep -v "Downloading\|Extracting" || true
          find ~/.cache/executorch/qnn/sdk-"$QAIRT_VERSION" -name libQnnHtp.so -path '*x86_64*' | grep -q .
          # The archives are only needed until extraction; keep them out of the cache.
          find ~/.cache/executorch/qnn \( -name '*.zip' -o -name '*.tar.xz' \) -delete
          du -sh ~/.cache/executorch/qnn

      - name: Save QAIRT
        if: steps.qairt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/executorch/qnn
          key: qairt-${{ env.QAIRT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # Exit 4 means this runner cannot build this window: recorded as a skip, so the other
      # jobs of the matrix stand on their own.
      - name: Export
        run: |
          set +e
          python -m pipeline export-qnn "$MODEL_ID" --soc "$SOC" --revision "$REVISION" \
            --out "$WORK_DIR/out" --work "$WORK_DIR/work" --context "$CONTEXT"
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            echo "SKIPPED=1" >>"$GITHUB_ENV"
            echo "::warning title=Window skipped::$MODEL_ID at $CONTEXT tokens on $SOC cannot be exported on this runner"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always() && env.SKIPPED != '1'
        run: |
          if compgen -G "$WORK_DIR/out/qnn/$TARGET/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend qnn --target "$TARGET" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.SKIPPED != '1'
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to Hugging Face
        if: inputs.publish_hf && env.SKIPPED != '1'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (write access to the output org)"
            exit 1
          fi
          python -m pipeline publish-hf "$WORK_DIR/out" --backend qnn --target "$TARGET"

      - name: Publish GitHub release
        if: inputs.publish_release && env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/out" --backend qnn --target "$TARGET"
