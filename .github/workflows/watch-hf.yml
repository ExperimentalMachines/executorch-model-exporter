name: Watch Hugging Face
# Checks the orgs in config/pipeline.yaml for new models and starts an export run for each
# eligible one. State (what has been seen, skipped and dispatched) is kept in seen.json on
# the `state` branch. The first run records existing models without exporting them.

on:
  schedule:
    # Hourly: a stage (XNNPACK, then QNN, then MediaTek) hands over to the next on the pass
    # after its last run finishes.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Comma-separated model ids to export now, even if already seen
        default: ""
        type: string
      dry_run:
        description: Report only; dispatch nothing and leave the state alone
        default: false
        type: boolean
      requeue:
        description: Put every export recorded as dispatched back in the queue (after cancelling runs)
        default: false
        type: boolean

permissions:
  contents: write # push the state branch
  actions: write # dispatch export workflows

concurrency:
  group: watch-hf
  cancel-in-progress: false

jobs:
  watch:
    # Hub metadata only, no model download.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      BACKFILL: ${{ inputs.backfill }}
      DRY_RUN: ${{ inputs.dry_run }}
      REQUEUE: ${{ inputs.requeue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions
        id: versions
        run: grep -E '^[A-Z_]+=' config/versions.env >>"$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/watch.txt

      - run: python -m pip install -r requirements/watch.txt

      - name: Check out the state branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth 1 origin state
            git worktree add --detach .state FETCH_HEAD
          else
            git worktree add --orphan -b state .state
          fi

      - name: Watch
        run: |
          args=(--state .state/seen.json --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$BACKFILL" ]; then args+=(--backfill "$BACKFILL"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$REQUEUE" = "true" ]; then args+=(--requeue); fi
          python -m pipeline watch "${args[@]}"

      # Saved even when a dispatch failed (the watch step exits 1): what was dispatched must
      # be recorded, or the next pass starts it again.
      - name: Save state
        if: ${{ !cancelled() && inputs.dry_run != true }}
        working-directory: .state
        run: |
          git add seen.json
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -q -m "watch: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:state
