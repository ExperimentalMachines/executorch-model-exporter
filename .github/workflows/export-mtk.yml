name: Export MediaTek
run-name: "MediaTek: ${{ inputs.model_id }}@${{ inputs.revision }}${{ inputs.contexts && format(' ctx {0}', inputs.contexts) || '' }}"

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id of a family with a MediaTek recipe (families.mtk_plan), e.g. Qwen/Qwen3-0.6B
        required: true
        type: string
      revision:
        description: Branch, tag or commit of the source repo
        default: main
        type: string
      socs:
        description: JSON list of chips, or empty for mtk.socs in config/pipeline.yaml
        default: ""
        type: string
      contexts:
        description: JSON list of context windows in tokens, one job per chip and window; empty for every tier in config/pipeline.yaml plus mtk.cache_size
        default: ""
        type: string
      publish_hf:
        description: Publish to the Hugging Face org in config/pipeline.yaml
        default: true
        type: boolean
      publish_release:
        description: Attach the files to a GitHub release
        default: true
        type: boolean

permissions:
  contents: write # GitHub releases

concurrency:
  group: export-mtk-${{ inputs.model_id }}
  cancel-in-progress: false

jobs:
  targets:
    # Hub metadata only, no model download.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    outputs:
      socs: ${{ steps.socs.outputs.socs }}
      contexts: ${{ steps.contexts.outputs.contexts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: socs
        env:
          SOCS: ${{ inputs.socs }}
        run: |
          if [ -z "$SOCS" ]; then
            python3 -m pip install --quiet pyyaml
            SOCS=$(python3 -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("config/pipeline.yaml"))["export"]["mtk"]["socs"]))')
          fi
          echo "socs=$SOCS" >>"$GITHUB_OUTPUT"
      - id: contexts
        env:
          CONTEXTS: ${{ inputs.contexts }}
        # Accepts a JSON list, one number, or a comma-separated list. Empty means every tier plus
        # mtk.cache_size, MediaTek's own window: calibration memory grows with the window, and 512
        # is the one built so far (docs/research, findings 22-24).
        run: |
          python3 -m pip install --quiet pyyaml
          CONTEXTS=$(python3 - "$CONTEXTS" <<'PY'
          import json, sys, yaml
          raw = sys.argv[1].strip()
          if not raw:
              export = yaml.safe_load(open("config/pipeline.yaml"))["export"]
              values = export["context_tiers"] + [export["mtk"]["cache_size"]]
          else:
              try:
                  values = json.loads(raw)
              except ValueError:
                  values = [v for v in raw.strip("[]").split(",") if v.strip()]
              if not isinstance(values, list):
                  values = [values]
          print(json.dumps(sorted({int(v) for v in values}, reverse=True)))
          PY
          )
          echo "contexts=$CONTEXTS" >>"$GITHUB_OUTPUT"

  export:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(needs.targets.outputs.socs) }}
        context: ${{ fromJSON(needs.targets.outputs.contexts) }}
    # Stays on x86: mtk_converter 8.13.0 is a cp310 x86 build and the NeuroPilot SDK
    # ships x86_64 libraries (finding 14).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      SOC: ${{ matrix.soc }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pipeline itself (fetch, reports, publishing) on the repo's usual Python.
      - uses: ./.github/actions/setup-export
        with:
          swap-gib: "24"
          requirements: requirements/export-mtk.txt

      - name: Name things
        run: |
          grep -E '^(NEUROPILOT_SDK_[A-Z0-9_]+|MTK_[A-Z_]+_VERSION|EXECUTORCH_COMMIT)=' config/versions.env >>"$GITHUB_ENV"
          soc_lower=$(echo "$SOC" | tr '[:upper:]' '[:lower:]')
          echo "TARGET=$soc_lower" >>"$GITHUB_ENV"
          echo "ARTIFACT=mtk-${soc_lower}-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: mtk-python
        with:
          python-version: ${{ env.MTK_PYTHON_VERSION }}
          update-environment: false

      # MediaTek's tools in their own Python 3.10 virtualenv (requirements/mtk-tools.txt says
      # why). The NeuroPilot Express SDK is downloaded from MediaTek on every run, checked
      # against the pinned digest, and deleted after its two wheels are installed: it is
      # licensed by MediaTek Inc. under its own terms (THIRD_PARTY_NOTICES.md), which every
      # run accepts, and nothing from it is cached, uploaded or published.
      - name: MediaTek tools
        run: |
          python_bin="${{ steps.mtk-python.outputs.python-path }}"
          "$python_bin" -m venv "$WORK_DIR/mtk-venv"
          tool_python="$WORK_DIR/mtk-venv/bin/python"
          "$tool_python" -m pip install --quiet --upgrade pip
          "$tool_python" -m pip install --quiet "$(grep -E '^torch==' requirements/mtk-tools.txt)" \
            --index-url https://download.pytorch.org/whl/cpu

          sdk="$RUNNER_TEMP/neuropilot"
          mkdir -p "$sdk"
          curl -fsSL --retry 3 --retry-all-errors -o "$sdk.tar.gz" "$NEUROPILOT_SDK_URL"
          echo "$NEUROPILOT_SDK_SHA256  $sdk.tar.gz" | sha256sum -c -
          tar xzf "$sdk.tar.gz" -C "$sdk" --strip-components=1 --wildcards \
            "*/mtk_neuron-${MTK_NEURON_VERSION}-*.whl" "*/mtk_converter-${MTK_CONVERTER_VERSION}+public-cp310-*.whl"
          # The 8.0.8 archive keeps mtk_converter only under mtk_converter-*_public_packages/.
          neuron_whl=$(find "$sdk" -name "mtk_neuron-${MTK_NEURON_VERSION}-*.whl" | head -1)
          converter_whl=$(find "$sdk" -name "mtk_converter-${MTK_CONVERTER_VERSION}+public-cp310-*.whl" | head -1)
          test -n "$neuron_whl" && test -n "$converter_whl"
          "$tool_python" -m pip install --quiet -r requirements/mtk-tools.txt "$neuron_whl" "$converter_whl"
          rm -rf "$sdk" "$sdk.tar.gz"
          "$tool_python" -m pip list | grep -iE '^(torch|torchao|executorch|transformers|mtk.converter|mtk.neuron) '
          echo "MTK_PYTHON=$tool_python" >>"$GITHUB_ENV"

      # The LLM export scripts are in the ExecuTorch source, not the wheel (BSD, fetched at
      # the pinned commit), with this repo's patches from third_party/executorch/patches.
      - name: ExecuTorch examples/mediatek
        run: |
          src="$WORK_DIR/executorch"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/pytorch/executorch.git
          git -C "$src" sparse-checkout set examples/mediatek
          git -C "$src" fetch -q --depth 1 origin "$EXECUTORCH_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          for patch in third_party/executorch/patches/mediatek-*.patch; do
            git -C "$src" apply -v "$GITHUB_WORKSPACE/$patch"
          done
          echo "MTK_EXAMPLES=$src/examples/mediatek" >>"$GITHUB_ENV"

      # Exit 4 means this runner cannot build this window: recorded as a skip, so the other
      # jobs of the matrix stand on their own.
      - name: Export
        run: |
          set +e
          python -m pipeline export-mtk "$MODEL_ID" --soc "$SOC" --revision "$REVISION" \
            --out "$WORK_DIR/out" --work "$WORK_DIR/work" --context "$CONTEXT"
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            echo "SKIPPED=1" >>"$GITHUB_ENV"
            echo "::warning title=Window skipped::$MODEL_ID at $CONTEXT tokens on $SOC cannot be exported on this runner"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always() && env.SKIPPED != '1'
        run: |
          if compgen -G "$WORK_DIR/out/mtk/$TARGET/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend mtk --target "$TARGET" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.SKIPPED != '1'
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to Hugging Face
        if: inputs.publish_hf && env.SKIPPED != '1'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (write access to the output org)"
            exit 1
          fi
          python -m pipeline publish-hf "$WORK_DIR/out" --backend mtk --target "$TARGET"

      - name: Publish GitHub release
        if: inputs.publish_release && env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/out" --backend mtk --target "$TARGET"
