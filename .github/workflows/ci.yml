name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Lint and unit tests only.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions
        id: versions
        run: grep -E '^[A-Z_]+=' config/versions.env >>"$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: |
          python -m pip install -r requirements/dev.txt
          # torch and safetensors for the checkpoint converter tests.
          python -m pip install "$(grep -E '^torch==' requirements/export-xnnpack.txt)" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(grep -E '^safetensors==' requirements/export-xnnpack.txt)" numpy
          # executorch for the QNN structural-check test (it builds and inspects a tiny .pte).
          python -m pip install "$(grep -E '^executorch==' requirements/export-xnnpack.txt)"

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
