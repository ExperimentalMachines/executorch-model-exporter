name: Probe runner
# Phase 0: what a standard hosted runner really has, and what an export really costs, so
# the sizing estimates in pipeline/sizing.py can be calibrated. Publishes nothing.

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Model to export at each window
        default: Qwen/Qwen3-0.6B
        type: string
      contexts:
        description: JSON list of windows, one job each
        default: "[2048, 16384]"
        type: string

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        context: ${{ fromJSON(inputs.contexts) }}
    # Sized on memory, not cores: 32 GB, because the causal masks grow with the window
    # squared and have killed a 32k export before (docs/research findings 2 and 28). The
    # CPU knee is not yet measured.
    # Exports stay on x86 until the runner works on aarch64. The toolchain is arm64-clean and
    # the export itself succeeded there, but the wheel's C++ TextLLMRunner raises
    # `IndexError: stoi` on ARM, and that runner is the smoke test: without it a published
    # file drops from "generated text and answered" to "the methods exist", which is the
    # standard the QNN and MediaTek programs were withdrawn for (findings 28, 30).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner hardware
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-200
          grep -E 'MemTotal|SwapTotal' /proc/meminfo
          lsblk -b -o NAME,SIZE,MOUNTPOINT

      - uses: ./.github/actions/setup-export
        with:
          swap-gib: "24"

      - name: Export at a forced window
        run: python -m pipeline export-xnnpack "$MODEL_ID" --context "$CONTEXT" --out "$WORK_DIR/out" --work "$WORK_DIR/work"

      - name: Summary
        if: always()
        run: |
          if compgen -G "$WORK_DIR/out/xnnpack/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend xnnpack >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.context }}
          path: ${{ env.WORK_DIR }}/out/xnnpack/export-report-*.json
          if-no-files-found: warn
